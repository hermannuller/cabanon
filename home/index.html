<main id="desktop" aria-label="Cabanon Desktop">
  <div id="files" aria-label="Desktop files"></div>
  <div id="windows"></div>
  <section id="from" hidden aria-label="From panel">
    <div class="resize north" data-resize="north"></div><div class="resize east" data-resize="east"></div><div class="resize corner" data-resize="both"></div>
    <aside class="system">
      <div class="clock"><time id="time"></time><div id="date"></div><div id="weekday"></div></div>
      <button class="weather" id="weather"><strong>26°C</strong><span>Sunny</span></button>
      <nav id="system-icons" aria-label="System controls"></nav>
      <button id="all-toggle" class="icon-button" title="All apps" aria-label="All apps"></button>
    </aside>
    <section id="pinned" aria-label="Pinned apps"></section>
    <section id="folders" aria-label="Pinned folders"></section>
    <div id="file-results" hidden aria-label="File search results"></div>
    <input id="file-search" aria-label="Search all files" placeholder="Search" autocomplete="off">
    <div id="flyout" hidden></div>
  </section>
  <section id="all-apps" hidden aria-label="All apps"><header><button class="mark" id="all-back" aria-label="Back to From"></button><input id="search" aria-label="Search apps" placeholder="Search"><div id="app-sort" role="group" aria-label="Sort apps"><button data-sort="name" aria-label="Sort A-Z" title="A–Z" aria-pressed="true"></button><button data-sort="installed" aria-label="Sort by installation date" title="Installed: new to old" aria-pressed="false"></button><button data-sort="usage" aria-label="Sort by frequency" title="Usage: frequent to rare" aria-pressed="false"></button></div></header><div id="app-grid"></div><p id="no-results" hidden>No applications found.</p></section>
  <button class="mark" id="start" aria-label="Open From" aria-expanded="false"></button>
  <section id="power-screen" hidden><div><h1 id="power-title"></h1><p>Cabanon power state</p><button id="resume">Return to Cabanon</button><button id="exit-prototype">Exit HOME</button></div></section>
</main>
